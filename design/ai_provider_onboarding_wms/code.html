          </p>

<script>
  // Model Selection Logic
  const modelCards = document.querySelectorAll('.model-card');
  
  function selectModel(selectedCard) {
    modelCards.forEach(card => {
      card.classList.remove('bg-primary-container', 'shadow-md');
      card.classList.add('bg-surface-container-highest');
      const textH3 = card.querySelector('h3');
      const textP = card.querySelector('p');
      const icon = card.querySelector('.material-symbols-outlined');
      const indicator = card.querySelector('.selection-indicator');
      
      textH3.classList.replace('text-on-primary-container', 'text-on-surface');
      textP.classList.replace('text-on-primary-container', 'text-on-surface-variant');
      icon.classList.remove('text-primary');
      indicator.classList.add('opacity-0');
      indicator.classList.remove('opacity-100');
    });

    selectedCard.classList.remove('bg-surface-container-highest');
    selectedCard.classList.add('bg-primary-container', 'shadow-md');
    
    const selTextH3 = selectedCard.querySelector('h3');
    const selTextP = selectedCard.querySelector('p');
    const selIcon = selectedCard.querySelector('.material-symbols-outlined');
    const selIndicator = selectedCard.querySelector('.selection-indicator');

    selTextH3.classList.replace('text-on-surface', 'text-on-primary-container');
    selTextP.classList.replace('text-on-surface-variant', 'text-on-primary-container');
    selIcon.classList.add('text-primary');
    selIndicator.classList.remove('opacity-0');
    selIndicator.classList.add('opacity-100');
  }

  modelCards.forEach(card => {
    card.addEventListener('click', () => selectModel(card));
  });

  // Select first by default
  if(modelCards.length > 0) {
    selectModel(modelCards[0]);
  }

  // Password Visibility Toggle
  const apiInput = document.getElementById('api-key');
  const toggleVisBtn = document.getElementById('toggle-visibility');
  const visIcon = document.getElementById('visibility-icon');

  toggleVisBtn.addEventListener('click', () => {
    if (apiInput.type === 'password') {
      apiInput.type = 'text';
      visIcon.textContent = 'visibility_off';
    } else {
      apiInput.type = 'password';
      visIcon.textContent = 'visibility';
    }
  });

  // Secure Toggle Logic
  const secureToggle = document.getElementById('secure-toggle');
  const secureKnob = document.getElementById('secure-toggle-knob');
  let isSecure = true;

  secureToggle.addEventListener('click', () => {
    isSecure = !isSecure;
    secureToggle.setAttribute('aria-checked', isSecure);
    
    if (isSecure) {
      secureKnob.classList.add('translate-x-6', 'bg-primary');
      secureKnob.classList.remove('translate-x-0', 'bg-on-surface-variant');
      secureToggle.classList.add('bg-surface');
      secureToggle.classList.remove('bg-surface-dim');
    } else {
      secureKnob.classList.remove('translate-x-6', 'bg-primary');
      secureKnob.classList.add('translate-x-0', 'bg-on-surface-variant');
      secureToggle.classList.remove('bg-surface');
      secureToggle.classList.add('bg-surface-dim');
    }
  });
</script></main></body></html>
