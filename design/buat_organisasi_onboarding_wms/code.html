<script>
  document.addEventListener('DOMContentLoaded', () => {
    const orgNameInput = document.getElementById('orgName');
    const orgDomainInput = document.getElementById('orgDomain');

    orgNameInput.addEventListener('input', (e) => {
      const name = e.target.value;
      if(name && !orgDomainInput.dataset.modifiedByUser) {
          const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
          orgDomainInput.value = slug;
      }
    });

    orgDomainInput.addEventListener('input', () => {
        orgDomainInput.dataset.modifiedByUser = 'true';
    });
  });
