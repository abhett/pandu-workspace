<script>
  // Simple interaction script to toggle integration states
  document.querySelectorAll('.integration-card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('bg-surface-container-high');
      card.classList.toggle('ring-2'); // using a utility for visual selection
      card.classList.toggle('ring-primary/50'); 
      
      const indicator = card.querySelector('.status-indicator');
      const icon = indicator.querySelector('span');
      
      if (indicator.classList.contains('bg-primary')) {
        // Deselect
        indicator.classList.remove('bg-primary', 'text-on-primary');
        indicator.classList.add('bg-surface-variant', 'text-on-surface-variant');
        icon.textContent = 'add';
      } else {
        // Select
        indicator.classList.remove('bg-surface-variant', 'text-on-surface-variant');
        indicator.classList.add('bg-primary', 'text-on-primary');
        icon.textContent = 'check';
      }
    });
  });
