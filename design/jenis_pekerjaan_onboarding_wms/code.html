<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes spinSlow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 60s linear infinite;
        }
        
        /* Selected State Styling */
        .category-card.selected {
            background-color: var(--tw-colors-surface-container-highest);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .category-card.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        /* Optional: Add a subtle border glow based on theme, handled via box-shadow inset for no structural change */
         .category-card.selected {
             box-shadow: inset 0 0 0 1px var(--tw-colors-primary-container), 0 4px 6px -1px rgb(0 0 0 / 0.1);
         }
    </style>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.category-card');
            const continueBtn = document.getElementById('continue-btn');
            let selectedCount = 0;

            cards.forEach(card => {
                card.addEventListener('click', (e) => {
                    // Toggle selection
                    const isSelected = card.classList.contains('selected');
                    
                    // Multi-select logic
                    if (isSelected) {
                        card.classList.remove('selected');
                        card.setAttribute('aria-pressed', 'false');
                        selectedCount--;
                    } else {
                        card.classList.add('selected');
                         card.setAttribute('aria-pressed', 'true');
                        selectedCount++;
                        
                        // Add a subtle click ripple effect
                        const rect = card.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        
                        const circle = document.createElement('span');
                        circle.style.position = 'absolute';
                        circle.style.left = `${x}px`;
                        circle.style.top = `${y}px`;
                        circle.style.width = '20px';
                        circle.style.height = '20px';
                        circle.style.background = 'rgba(255,255,255,0.1)';
                        circle.style.borderRadius = '50%';
                        circle.style.transform = 'translate(-50%, -50%) scale(0)';
                        circle.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
                        circle.style.pointerEvents = 'none';
                        
                        card.appendChild(circle);
                        
                        requestAnimationFrame(() => {
                            circle.style.transform = 'translate(-50%, -50%) scale(15)';
                            circle.style.opacity = '0';
                        });
                        
                        setTimeout(() => circle.remove(), 400);
                    }

                    // Update continue button state
                    if (selectedCount > 0) {
                        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    } else {
                        continueBtn.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    }
                });
            });
        });
    </script>
