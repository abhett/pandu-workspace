<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface"><main class="w-full flex items-center justify-center min-h-screen p-margin-desktop"><div class="flex flex-col w-full h-full items-center justify-center relative overflow-hidden bg-background">
<!-- Confetti Background Layer -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<svg height="100%" preserveaspectratio="none" viewbox="0 0 100 100" width="100%">
<defs>
<pattern height="10" id="confetti" patternunits="userSpaceOnUse" width="10" x="0" y="0">
<circle cx="2" cy="2" fill="#c3c0ff" opacity="0.8" r="1"></circle>
<rect fill="#4edea3" height="3" opacity="0.6" transform="rotate(45 6 8)" width="2" x="5" y="7"></rect>
<circle cx="8" cy="4" fill="#3B82F6" opacity="0.7" r="1.5"></circle>
<polygon fill="#F59E0B" opacity="0.9" points="1,8 3,10 0,9"></polygon>
<rect fill="#8B5CF6" height="1.5" opacity="0.5" transform="rotate(15 7.75 1.75)" width="1.5" x="7" y="1"></rect>
</pattern>
</defs>
<rect fill="url(#confetti)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent z-10 pointer-events-none"></div>
<!-- Main Content Card -->
<div class="relative z-20 flex flex-col items-center justify-center text-center max-w-lg p-margin-desktop bg-surface-container rounded-xl shadow-xl transition-all duration-700 ease-out transform translate-y-0 opacity-100" id="success-card">
<!-- Success Icon Container with Pulse Effect -->
<div class="relative w-24 h-24 mb-stack-lg flex items-center justify-center">
<div class="absolute inset-0 bg-status-done/20 rounded-full animate-ping opacity-75"></div>
<div class="relative z-10 w-16 h-16 bg-status-done text-surface-container-lowest rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-display font-display" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm tracking-tight">
      Workspace Anda Siap Digunakan!
    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg max-w-md">
      Semua konfigurasi telah berhasil disimpan. Anda kini dapat mulai berkolaborasi, melacak proyek, dan mengelola tim Anda dengan lebih efisien.
    </p>
<!-- Action Area -->
<div class="w-full flex flex-col gap-stack-md mt-stack-md">
<button class="w-full py-stack-md px-stack-lg bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-fixed transition-colors duration-200 flex items-center justify-center gap-stack-xs group">
<span>Masuk ke Dashboard</span>
<span class="material-symbols-outlined transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
<div class="flex items-center justify-center gap-stack-xs text-on-surface-variant/70">
<span class="material-symbols-outlined text-label-sm font-label-sm">lock</span>
<span class="font-label-sm text-label-sm">Koneksi aman & terenkripsi</span>
</div>
</div>
</div>
<!-- Decorative Stats/Widgets subtly placed around -->
<div class="absolute top-1/4 left-10 hidden lg:flex flex-col bg-surface-container-low p-stack-md rounded-lg shadow-md opacity-60 transform -rotate-6 transition-transform hover:rotate-0 hover:opacity-100 duration-300">
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-stack-xs">Tim Anda</div>
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-tint flex items-center justify-center text-on-primary-container font-label-md">3</div>
<span class="font-body-sm text-body-sm text-on-surface">Anggota Baru</span>
</div>
</div>
<div class="absolute bottom-1/4 right-10 hidden lg:flex flex-col bg-surface-container-low p-stack-md rounded-lg shadow-md opacity-60 transform rotate-3 transition-transform hover:rotate-0 hover:opacity-100 duration-300">
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-stack-xs">Proyek Aktif</div>
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-tertiary flex items-center justify-center text-on-tertiary font-label-md">1</div>
<span class="font-body-sm text-body-sm text-on-surface">Template Dimuat</span>
</div>
</div>
</div>
<script>
  // Simple entry animation for the card to feel native
  document.addEventListener("DOMContentLoaded", () => {
    const card = document.getElementById('success-card');
    if(card) {
      // Reset state for animation
      card.classList.remove('translate-y-0', 'opacity-100');
      card.classList.add('translate-y-8', 'opacity-0');
      
      // Trigger reflow
      void card.offsetWidth;
      
      // Animate in
      setTimeout(() => {
        card.classList.remove('translate-y-8', 'opacity-0');
        card.classList.add('translate-y-0', 'opacity-100');
      }, 100);
    }
  });
</script></main></body></html>
