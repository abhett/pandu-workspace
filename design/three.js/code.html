<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_123 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_123" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_123');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('streaming-indicator');
const canvas = document.createElement('canvas');
container.appendChild(canvas);
const ctx = canvas.getContext('2d');

let width, height;
const dots = [];
const dotCount = 12;

function resize() {
  width = container.clientWidth || 300;
  height = container.clientHeight || 40;
  canvas.width = width;
  canvas.height = height;
}

window.addEventListener('resize', resize);
resize();

for (let i = 0; i < dotCount; i++) {
  dots.push({
    x: (width / dotCount) * i + (width / dotCount / 2),
    y: height / 2,
    phase: i * (Math.PI * 2 / dotCount)
  });
}

function animate(time) {
  ctx.clearRect(0, 0, width, height);
  const primaryColor = '#4f46e5'; // Primary from design system
  
  dots.forEach((dot, i) => {
    const bounce = Math.sin(time / 200 + dot.phase) * 5;
    const opacity = 0.3 + (Math.sin(time / 200 + dot.phase) + 1) / 2 * 0.7;
    
    ctx.beginPath();
    ctx.arc(dot.x, dot.y + bounce, 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(79, 70, 229, ${opacity})`;
    ctx.fill();
  });
  
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_123 -->
</body>
</html>
