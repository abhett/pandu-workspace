<div class="flex flex-col items-center justify-center min-h-[70vh]">
<div class="w-full max-w-2xl bg-surface-container rounded-xl shadow-lg p-stack-lg flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Decorative Background Element -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-64 h-64 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex flex-col gap-stack-sm text-center relative z-10">
<h1 class="font-display text-display text-on-surface">Undang Anggota Tim</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">
                    Ajak kolega Anda untuk berkolaborasi dan tingkatkan produktivitas tim. Anda bisa menambahkan mereka sekarang atau nanti.
                </p>
</div>
<div class="bg-surface-container-low rounded-xl p-stack-md flex items-center justify-between shadow-sm relative z-10">
<div class="flex items-center gap-stack-sm overflow-hidden flex-1 mr-stack-md">
<span class="material-symbols-outlined text-outline">link</span>
<span class="font-mono text-mono text-on-surface-variant truncate" id="invite-link">https://app.example.com/invite/t-8f92a1b</span>
</div>
<button class="flex items-center gap-stack-xs px-stack-md py-stack-sm bg-surface-container-high hover:bg-surface-bright rounded-lg transition-colors group whitespace-nowrap" id="copy-btn">
<span class="material-symbols-outlined text-label-md text-primary group-hover:scale-110 transition-transform">content_copy</span>
<span class="font-label-md text-label-md text-on-surface" id="copy-text">Salin Link</span>
</button>
</div>
<div class="flex items-center gap-stack-md relative z-10">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">ATAU UNDANG VIA EMAIL</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<div class="flex flex-col gap-stack-md relative z-10" id="invite-list">
<!-- Initial Input Row -->
<div class="flex flex-col md:flex-row gap-stack-sm items-start md:items-center">
<div class="relative flex-1 w-full">
<span class="material-symbols-outlined absolute left-stack-sm top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg py-stack-sm pl-10 pr-stack-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow shadow-sm placeholder:text-outline-variant" placeholder="email@perusahaan.com" type="email"/>
</div>
<div class="relative w-full md:w-48">
<select class="w-full appearance-none bg-surface text-on-surface font-body-md text-body-md rounded-lg py-stack-sm pl-stack-sm pr-10 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow shadow-sm cursor-pointer">
<option value="member">Member</option>
<option value="admin">Admin</option>
<option value="guest">Guest</option>
</select>
<span class="material-symbols-outlined absolute right-stack-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Second Input Row -->
<div class="flex flex-col md:flex-row gap-stack-sm items-start md:items-center">
<div class="relative flex-1 w-full">
<span class="material-symbols-outlined absolute left-stack-sm top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg py-stack-sm pl-10 pr-stack-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow shadow-sm placeholder:text-outline-variant" placeholder="email@perusahaan.com" type="email"/>
</div>
<div class="relative w-full md:w-48">
<select class="w-full appearance-none bg-surface text-on-surface font-body-md text-body-md rounded-lg py-stack-sm pl-stack-sm pr-10 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow shadow-sm cursor-pointer">
<option value="member">Member</option>
<option value="admin">Admin</option>
<option value="guest">Guest</option>
</select>
<span class="material-symbols-outlined absolute right-stack-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<button class="self-start flex items-center gap-stack-xs text-primary hover:text-primary-fixed transition-colors font-label-md text-label-md py-stack-xs relative z-10" id="add-more-btn">
<span class="material-symbols-outlined">add</span>
                Tambah Email Lain
            </button>
<div class="mt-stack-lg flex flex-col-reverse md:flex-row items-center justify-between gap-stack-md relative z-10">
<button class="w-full md:w-auto px-stack-lg py-stack-sm font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors">
                    Lewati langkah ini
                </button>
<button class="w-full md:w-auto bg-primary hover:bg-primary-fixed text-on-primary font-label-md text-label-md px-stack-lg py-stack-sm rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-stack-xs group">
                    Kirim Undangan & Lanjut
                    <span class="material-symbols-outlined text-on-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
<!-- Illustration / Decor -->
<div class="mt-stack-lg max-w-2xl w-full flex justify-center opacity-80">
<svg class="w-64 h-auto text-surface-variant" fill="currentColor" viewbox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
<circle class="text-surface-container-highest" cx="50" cy="50" r="30"></circle>
<circle class="text-surface-container-high" cx="100" cy="50" r="40"></circle>
<circle class="text-surface-container-highest" cx="150" cy="50" r="30"></circle>
<path class="text-outline-variant/30" d="M50 50 L100 50 L150 50" fill="none" stroke="currentColor" stroke-dasharray="8 4" stroke-width="4"></path>
</svg>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Copy to clipboard functionality
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const inviteLink = document.getElementById('invite-link').innerText;

        if(copyBtn) {
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(inviteLink);
                    const originalText = copyText.innerText;
                    copyText.innerText = 'Tersalin!';
                    const icon = copyBtn.querySelector('.material-symbols-outlined');
                    const originalIcon = icon.innerText;
                    icon.innerText = 'check';
                    copyBtn.classList.add('text-status-done', 'bg-status-done/10');
                    
                    setTimeout(() => {
                        copyText.innerText = originalText;
                        icon.innerText = originalIcon;
                        copyBtn.classList.remove('text-status-done', 'bg-status-done/10');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy: ', err);
                }
            });
        }

        // Add more email rows
        const addMoreBtn = document.getElementById('add-more-btn');
        const inviteList = document.getElementById('invite-list');

        if(addMoreBtn && inviteList) {
            addMoreBtn.addEventListener('click', () => {
                const newRow = document.createElement('div');
                newRow.className = 'flex flex-col md:flex-row gap-stack-sm items-start md:items-center opacity-0 transform -translate-y-4 transition-all duration-300 ease-out';
                newRow.innerHTML = `
                    <div class="relative flex-1 w-full">
                        <span class="material-symbols-outlined absolute left-stack-sm top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
                        <input type="email" placeholder="email@perusahaan.com" class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg py-stack-sm pl-10 pr-stack-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow shadow-sm placeholder:text-outline-variant" />
                    </div>
                    <div class="relative w-full md:w-48">
                        <select class="w-full appearance-none bg-surface text-on-surface font-body-md text-body-md rounded-lg py-stack-sm pl-stack-sm pr-10 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow shadow-sm cursor-pointer">
                            <option value="member">Member</option>
                            <option value="admin">Admin</option>
                            <option value="guest">Guest</option>
                        </select>
                        <span class="material-symbols-outlined absolute right-stack-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
                    </div>
                    <button class="md:p-stack-sm text-outline-variant hover:text-status-blocked transition-colors self-end md:self-auto remove-btn" aria-label="Remove row">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                `;
                inviteList.appendChild(newRow);
                
                // Trigger animation
                requestAnimationFrame(() => {
                    newRow.classList.remove('opacity-0', '-translate-y-4');
                });

                // Attach remove event
                const removeBtn = newRow.querySelector('.remove-btn');
                removeBtn.addEventListener('click', () => {
                    newRow.classList.add('opacity-0', '-translate-x-4');
                    setTimeout(() => newRow.remove(), 300);
                });
            });
        }
    });
</script></main></body></html>
